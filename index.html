    <!-- Apply the saved theme before first paint to avoid a flash -->
    <script>
        (function () {
            try {
                var theme = localStorage.getItem('theme')
                    || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', theme);
            } catch (error) {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

        rel="stylesheet">

    <link rel="stylesheet" href="style.css?v=20261003-1">
</head>

    <div class="app" id="app" data-view="input">
        <!-- 刀 list: sidebar on desktop, bottom strip on smaller screens -->
        <aside class="sidebar" aria-label="記憶管理">
            <div class="brand">
                <svg class="icon brand-icon" aria-hidden="true"><use href="#i-logo"></use></svg>
                <div class="brand-text">
                    <h1 class="brand-title">補償刀時間軸</h1>
                    <p class="brand-sub">公主連結 Re:Dive</p>
                </div>
                <button id="sidebar-collapse" class="icon-btn sidebar-toggle" type="button" aria-label="收合刀列表"
                    title="收合刀列表" aria-controls="slot-list" aria-expanded="true">
                    <svg class="icon"><use href="#i-panel-left"></use></svg>
                </button>
            </div>

            <div class="slots-head">
                <span class="slots-heading">我的刀 <span id="slot-count" class="slots-count"></span></span>
                <button id="slot-add" class="slot-add-btn" type="button" title="新增一刀" aria-label="新增一刀">
                    <svg class="icon"><use href="#i-plus"></use></svg>
                    <span class="slot-add-label">新增</span>
                </button>
            </div>

            <div id="slot-list" class="slot-list" role="list" aria-label="已儲存的刀"></div>

            <div class="sidebar-foot">
                <a class="foot-link" href="https://github.com/Anong0u0/PCR-TimeLineShift" target="_blank"
                    rel="noopener">
                    <svg class="icon"><use href="#i-github"></use></svg>GitHub
                </a>
                <span class="foot-hint">資料只存在這個瀏覽器</span>
            </div>
        </aside>

        <main class="workspace">
            <!-- Current 刀 -->
            <header class="topbar">
                <button id="sidebar-expand" class="icon-btn sidebar-toggle sidebar-expand" type="button"
                    aria-label="展開刀列表" title="展開刀列表" aria-controls="slot-list" aria-expanded="false">
                    <svg class="icon"><use href="#i-panel-left"></use></svg>
                </button>
                <svg class="icon topbar-mark" aria-hidden="true"><use href="#i-logo"></use></svg>
                <div class="title-field">
                    <input id="slot-title" class="slot-title" type="text" maxlength="50" autocomplete="off"
                        spellcheck="false" enterkeyhint="done" aria-label="刀名稱（留空則使用第一行）" title="點擊改名">
                    <svg class="icon title-pencil" aria-hidden="true"><use href="#i-pencil"></use></svg>
                </div>
                <div class="topbar-actions">
                    <button id="ocr-upload-btn" class="btn btn-soft js-ocr ocr-btn" type="button"
                        title="上傳截圖辨識文字（也可以直接貼上或拖曳圖片）">
                        <svg class="icon ocr-icon"><use href="#i-image"></use></svg>
                        <span class="spinner" aria-hidden="true"></span>
                        <span class="btn-label">圖片辨識</span>
                    </button>
                    <input id="ocr-file-input" type="file" accept="image/*" hidden>
                    <button id="theme-toggle" class="icon-btn" type="button" aria-label="切換深色模式" title="切換深色模式">
                        <svg class="icon theme-icon-moon"><use href="#i-moon"></use></svg>
                        <svg class="icon theme-icon-sun"><use href="#i-sun"></use></svg>
                    </button>
                    <button id="more-btn" class="icon-btn" type="button" aria-label="更多動作" title="更多動作"
                        aria-haspopup="menu" aria-expanded="false" aria-controls="more-menu">
                        <svg class="icon"><use href="#i-more"></use></svg>
                    </button>
                </div>
            </header>

            <!-- Remaining seconds -->
            <section class="shift-card" id="controls-card" aria-label="剩餘秒數與選項">
                <div class="shift-main">
                    <label class="shift-label" for="seconds-input">
                        <span class="shift-label-title">剩餘秒數</span>
                        <span id="shift-delta" class="shift-delta"></span>
                    </label>
                    <div class="stepper">
                        <button id="btn-minus" class="step-btn" type="button" aria-label="減 1 秒" title="減 1 秒（按住連續）">
                            <svg class="icon"><use href="#i-minus"></use></svg>
                        </button>
                        <div class="seconds-box">
                            <input type="number" id="seconds-input" class="seconds-input" value="90" min="0" max="90"
                                inputmode="numeric" enterkeyhint="done">
                            <span class="seconds-unit" aria-hidden="true">秒</span>
                        </div>
                        <button id="btn-plus" class="step-btn" type="button" aria-label="加 1 秒" title="加 1 秒（按住連續）">
                            <svg class="icon"><use href="#i-plus"></use></svg>
                        </button>
                    </div>
                </div>
                <div class="shift-slider">
                    <input type="range" id="seconds-slider" class="slider" min="0" max="90" value="90"
                        aria-label="剩餘秒數">
                    <div class="slider-scale" aria-hidden="true">
                        <span style="--p: 0">0</span>
                        <span style="--p: 0.3333">30</span>
                        <span style="--p: 0.6667">60</span>
                        <span style="--p: 1">90</span>
                    </div>
                </div>
                <div class="shift-options" role="group" aria-label="轉換選項">
                    <div class="opt-chip">
                        <label class="opt-toggle" for="hide-low-time">
                            <input type="checkbox" id="hide-low-time" checked data-summary="隱藏&lt;1秒">
                            <span class="opt-label">隱藏&lt;1秒軸</span>
                        </label>
                        <button type="button" class="opt-info" aria-label="隱藏&lt;1秒軸的說明"
                            data-tip="隱藏換算後不到 1 秒的行（含其後的說明行）。關閉時改以「// === 補償時間不足 ===」分隔提示。">
                            <svg class="icon"><use href="#i-info"></use></svg>
                        </button>
                    </div>
                    <div class="opt-chip">
                        <label class="opt-toggle" for="strict-mode">
                            <input type="checkbox" id="strict-mode" data-summary="嚴格">
                            <span class="opt-label">嚴格模式</span>
                        </label>
                        <button type="button" class="opt-info" aria-label="嚴格模式的說明"
                            data-tip="每行只換算第一個時間，後面的時間保持原樣。">
                            <svg class="icon"><use href="#i-info"></use></svg>
                        </button>
                    </div>
                    <div class="opt-chip">
                        <label class="opt-toggle" for="ignore-comment">
                            <input type="checkbox" id="ignore-comment" data-summary="含註解">
                            <span class="opt-label">換算註解時間</span>
                        </label>
                        <button type="button" class="opt-info" aria-label="換算註解時間的說明"
                            data-tip="預設不處理 # 或 // 之後的時間，開啟後也會一併換算。">
                            <svg class="icon"><use href="#i-info"></use></svg>
                        </button>
                    </div>
                    <div class="opt-chip">
                        <label class="opt-toggle" for="highlight-time">
                            <input type="checkbox" id="highlight-time" data-summary="凸顯">
                            <span class="opt-label">凸顯時間</span>
                        </label>
                        <button type="button" class="opt-info" aria-label="凸顯時間的說明"
                            data-tip="在結果中以底色標示換算過的時間。">
                            <svg class="icon"><use href="#i-info"></use></svg>
                        </button>
                    </div>
                </div>
                <div id="options-summary" class="options-summary" aria-hidden="true"></div>
                <button id="controls-collapse" class="icon-btn collapse-btn" type="button" aria-expanded="true"
                    aria-label="摺疊設定" title="摺疊設定">
                    <svg class="icon"><use href="#i-chevron-up"></use></svg>
                </button>
            </section>

            <!-- Editors -->
            <div class="panes">
                <div class="panes-bar">
                    <div class="segmented view-switch" role="tablist" aria-label="切換檢視">
                        <button type="button" role="tab" class="seg-btn" data-view="input" id="view-input-tab"
                            aria-controls="input-pane" aria-selected="true">原始軸</button>
                        <button type="button" role="tab" class="seg-btn" data-view="output" id="view-output-tab"
                            aria-controls="output-pane" aria-selected="false">結果</button>
                    </div>
                    <div class="panes-bar-tools" data-for="input">
                        <button class="icon-btn js-paste" type="button" aria-label="從剪貼簿貼上" title="從剪貼簿貼上">
                            <svg class="icon"><use href="#i-clipboard"></use></svg>
                        </button>
                        <button class="icon-btn js-clear" type="button" aria-label="清空原始軸" title="清空原始軸">
                            <svg class="icon"><use href="#i-eraser"></use></svg>
                        </button>
                    </div>
                    <div class="panes-bar-tools" data-for="output">
                        <button class="btn btn-primary js-copy" type="button">
                            <svg class="icon copy-icon"><use href="#i-copy"></use></svg>
                            <svg class="icon copied-icon"><use href="#i-check"></use></svg>
                            <span class="copy-label">複製</span>
                        </button>
                    </div>
                </div>

                <section class="pane pane-input" id="input-pane" aria-label="原始軸">
                    <header class="pane-head">
                        <span class="pane-title">原始軸</span>
                        <span class="pane-tag">90 秒</span>
                        <div class="pane-tools">
                            <button class="btn btn-ghost btn-sm js-paste" type="button" title="從剪貼簿貼上文字或圖片">
                                <svg class="icon"><use href="#i-clipboard"></use></svg>貼上
                            </button>
                            <button class="btn btn-ghost btn-sm js-clear" type="button" title="清空原始軸">
                                <svg class="icon"><use href="#i-eraser"></use></svg>清空
                            </button>
                            <button id="input-collapse" class="icon-btn icon-btn-sm" type="button" aria-expanded="true"
                                aria-controls="input-text" aria-label="摺疊原始軸" title="摺疊原始軸">
                                <svg class="icon"><use href="#i-chevrons-left"></use></svg>
                            </button>
                        </div>
                    </header>
                    <textarea id="input-text" spellcheck="false" autocomplete="off" aria-label="原始軸"
                        placeholder="在此貼上 90 秒的時間軸，例如：&#10;1:30 開場&#10;1:12 UB 凱留&#10;0:48 UB 鏡華&#10;&#10;也可以直接貼上或拖曳截圖，自動辨識文字。"></textarea>
                    <button id="input-expand" class="pane-rail" type="button" aria-controls="input-text"
                        aria-expanded="false" title="展開原始軸">
                        <svg class="icon"><use href="#i-chevrons-right"></use></svg>
                        <span class="pane-rail-label">展開原始軸</span>
                    </button>
                </section>

                <section class="pane pane-output" id="output-pane" aria-label="調整後結果">
                    <header class="pane-head">
                        <span class="pane-title">調整後</span>
                        <span id="output-tag" class="pane-tag pane-tag-accent">90 秒</span>
                        <div class="pane-tools">
                            <button id="copy-btn" class="btn btn-primary btn-sm js-copy" type="button">
                                <svg class="icon copy-icon"><use href="#i-copy"></use></svg>
                                <svg class="icon copied-icon"><use href="#i-check"></use></svg>
                                <span class="copy-label">複製結果</span>
                            </button>
                        </div>
                    </header>
                    <div class="code-content custom-scrollbar">
                        <pre><code id="output-code" class="language-cs"></code></pre>
                        <div id="output-empty" class="empty-state" hidden>
                            <svg class="icon empty-icon" aria-hidden="true"><use href="#i-doc"></use></svg>
                            <p class="empty-title">貼上 90 秒的時間軸</p>
                            <p class="empty-desc">輸入或貼上文字後，會依剩餘秒數即時換算。<br>也可以貼上或拖曳截圖，自動辨識文字。</p>
                            <div class="empty-actions">
                                <button class="btn btn-soft js-ocr" type="button">
                                    <svg class="icon"><use href="#i-image"></use></svg>上傳截圖
                                </button>
                                <button id="load-example" class="btn btn-ghost" type="button">載入範例</button>
                            </div>
                        </div>
                    </div>
                    <footer id="output-stats" class="pane-foot" aria-live="polite"></footer>
                </section>
            </div>
        </main>
    </div>

    <!-- More menu -->
    <div id="more-menu" class="popover menu" role="menu" aria-label="更多動作" hidden>
        <button type="button" class="menu-item" role="menuitem" data-action="rename">
            <svg class="icon"><use href="#i-pencil"></use></svg>重新命名
        </button>
        <button type="button" class="menu-item" role="menuitem" data-action="duplicate">
            <svg class="icon"><use href="#i-files"></use></svg>建立複本
        </button>
        <button type="button" class="menu-item menu-item-danger" role="menuitem" data-action="delete">
            <svg class="icon"><use href="#i-trash"></use></svg>刪除這刀
        </button>
        <div class="menu-sep" role="separator"></div>
        <button type="button" class="menu-item" role="menuitem" data-action="display">
            <svg class="icon"><use href="#i-type"></use></svg>顯示設定（換行、字級）
        </button>
        <button type="button" class="menu-item" role="menuitem" data-action="fullscreen" id="fullscreen-toggle" hidden>
            <svg class="icon"><use href="#i-maximize"></use></svg><span class="fullscreen-label">全螢幕</span>
        </button>
    </div>

    <!-- Per-刀 menu (left list) -->
    <div id="slot-menu" class="popover menu" role="menu" aria-label="這刀的動作" hidden>
        <button type="button" class="menu-item" role="menuitem" data-action="rename">
            <svg class="icon"><use href="#i-pencil"></use></svg>重新命名
        </button>
        <button type="button" class="menu-item" role="menuitem" data-action="duplicate">
            <svg class="icon"><use href="#i-files"></use></svg>建立複本
        </button>
        <button type="button" class="menu-item menu-item-danger" role="menuitem" data-action="delete">
            <svg class="icon"><use href="#i-trash"></use></svg>刪除
        </button>
    </div>

    <!-- Display settings -->
    <div id="display-popover" class="popover options-popover" role="dialog" aria-labelledby="display-title" hidden>
        <div class="popover-head">
            <h2 id="display-title" class="popover-title">顯示設定</h2>
            <button type="button" class="icon-btn js-popover-close" aria-label="關閉">
                <svg class="icon"><use href="#i-x"></use></svg>
            </button>
        </div>
        <label class="option" for="wrap-lines">
            <span class="option-text">
                <span class="option-title">自動換行</span>
                <span class="option-desc">過長的行自動折行，關閉時改為左右捲動。</span>
            </span>
            <input type="checkbox" class="switch" id="wrap-lines" checked>
        </label>
        <div class="option">
            <span class="option-text">
                <span class="option-title">文字大小</span>
            </span>
            <div class="segmented segmented-sm" role="radiogroup" aria-label="文字大小" id="font-size-group">
                <button type="button" class="seg-btn" role="radio" data-size="sm" aria-checked="false">小</button>
                <button type="button" class="seg-btn" role="radio" data-size="md" aria-checked="true">中</button>
                <button type="button" class="seg-btn" role="radio" data-size="lg" aria-checked="false">大</button>
            </div>
        </div>
    </div>

    <div id="popover-backdrop" class="popover-backdrop" hidden></div>
    <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
    <div id="toast-region" class="toast-region" aria-live="polite"></div>

    <div id="ocr-drop-overlay" class="ocr-drop-overlay" aria-hidden="true">
        <div class="ocr-drop-overlay-content">
            <svg class="icon"><use href="#i-image"></use></svg>
            <strong>放開以辨識圖片</strong>
            <span>辨識結果會存進目前的刀；已有內容時另存成新的一刀</span>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="ppocrv5.plugin.js?v=20260227"></script>
    <script src="script.js?v=20261003"></script>
</body>

</html>
